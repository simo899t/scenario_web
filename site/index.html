<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teater Scenario</title>
  <meta name="description" content="Teater Scenario – teater, musicals og teaterkoncerter for unge.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tæppet der går fra hinanden når siden åbner -->
  <div class="curtain" aria-hidden="true">
    <div class="curtain-half"></div>
    <div class="curtain-half"></div>
  </div>

  <header class="nav">
    <a href="#top" class="nav-logo"><img src="billeder/logo.png" alt="scenario"></a>
    <nav class="nav-links">
      <a href="#aktuelt">Aktuelt</a>
      <a href="om.html">Om os</a>
      <a href="#events">Forestillinger</a>
      <a href="#medvirk">Vær med</a>
      <a href="#kontakt">Kontakt</a>
    </nav>
  </header>

  <main id="top">

    <section class="hero">
      <div class="hero-bg"></div>
      <h1 class="hero-title"><img src="billeder/logo.png" alt="scenario"></h1>
      <p class="hero-sub" id="f-undertitel"></p>
      <a href="#aktuelt" class="scroll-hint" aria-label="Scroll ned"></a>
    </section>

    <section class="feature" id="aktuelt" hidden>
      <div class="wrap">
        <article class="ticket reveal">
          <div class="ticket-img"><img id="a-billede" alt=""></div>
          <div class="ticket-body">
            <p class="ticket-label">Næste forestilling</p>
            <h2 class="ticket-title"><span id="a-titel"></span> <span class="ticket-type" id="a-type"></span></h2>
            <dl class="ticket-facts">
              <div><dt>Hvornår</dt><dd id="a-datoer"></dd></div>
              <div><dt>Hvor</dt><dd id="a-sted"></dd></div>
            </dl>
            <p class="countdown" id="countdown" hidden>
              <span><b data-u="d">0</b> dage</span>
              <span><b data-u="h">0</b> timer</span>
              <span><b data-u="m">0</b> min</span>
              <span><b data-u="s">0</b> sek</span>
            </p>
            <p class="ticket-q" id="a-spoergsmaal"></p>
            <p class="ticket-text" id="a-tekst"></p>
            <div class="ticket-buttons">
              <a class="btn" id="a-billet" href="#" hidden>Køb billet</a>
              <a class="btn btn-dark" id="a-laesmere" href="#" hidden>læs mere her</a>
            </div>
          </div>
        </article>
      </div>
    </section>

    <section class="about" id="om">
      <div class="wrap">
        <h2 class="big" id="om-overskrift"></h2>
        <p class="about-short" id="om-kort"></p>
        <a class="btn btn-dark" id="om-knap" href="om.html"></a>
      </div>
    </section>

    <section class="events" id="events">
      <div class="wrap">
        <h2 class="big">Forestillinger</h2>
        <div class="event-list" id="event-list" data-max="3"></div>
        <a class="all-link" id="alle-link" href="forestillinger.html" hidden>Se alle forestillinger →</a>
      </div>
    </section>

    <section class="join" id="medvirk">
      <div class="wrap">
        <h2 class="big" id="m-overskrift"></h2>
        <p class="lead" id="m-tekst"></p>
        <ul class="roles" id="m-roller"></ul>
        <a class="btn btn-light" id="m-knap" href="#"></a>
      </div>
    </section>

    <section class="sponsors" id="sponsorer">
      <div class="wrap">
        <h2 class="big">Sponsorer &amp; netværk</h2>
      </div>
      <div class="marquee"><div class="marquee-track" id="sponsor-track"></div></div>
    </section>

  </main>

  <footer class="footer" id="kontakt">
    <div class="wrap">
      <h2 class="big">Kontakt</h2>
      <a class="footer-mail" id="k-email" href="#"></a>
      <div class="footer-row">
        <span id="k-cvr"></span>
        <span id="k-some"></span>
        <span>© <span id="year"></span> Teater Scenario</span>
      </div>
    </div>
  </footer>

  <script src="indhold.js"></script>
  <script src="script.js"></script>
</body>
</html>
