<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teater Scenario er flyttet</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.teaterscenario.dk/">
  <link rel="icon" href="favicon.ico" sizes="any">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: grid; place-items: center; padding: 24px; text-align: center;
      background: radial-gradient(70% 60% at 20% 85%, rgba(140, 14, 22, .55), transparent 70%),
                  radial-gradient(60% 55% at 85% 15%, rgba(120, 12, 20, .45), transparent 70%), #120e0d;
      color: #f4ece0; font: 1.05rem/1.6 "Work Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 34rem; }
    img { width: min(70vw, 360px); height: auto; margin: 0 auto 2.5rem; display: block; }
    h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 600; letter-spacing: -.02em; line-height: 1.15; margin-bottom: 1rem; }
    p { color: #d9cfc3; margin-bottom: 2rem; }
    a.btn { display: inline-block; background: #f4ece0; color: #120e0d; text-decoration: none; font-weight: 500; letter-spacing: .04em; padding: .9rem 2rem; }
    a.btn:hover { background: #fff; }
    a.btn:focus-visible { outline: 2px solid #f4ece0; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="Teater Scenario" width="838" height="216">
    <h1>Vi er flyttet</h1>
    <p>Teater Scenarios hjemmeside ligger nu på www.teaterscenario.dk.</p>
    <a class="btn" href="https://www.teaterscenario.dk/">Gå til teaterscenario.dk</a>
  </main>
</body>
</html>
